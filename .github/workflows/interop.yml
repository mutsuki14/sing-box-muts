name: interop

on:
  pull_request:
    branches: [muts-main]
  workflow_dispatch:
permissions:
  contents: read

jobs:
  hard-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.12'
          cache: true
      - name: Run interoperability hard gate
        run: python3 fork-test/interop/run.py --results fork-test/interop/results
      - name: Upload reports and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: muts-11-interop-results
          path: fork-test/interop/results/
          if-no-files-found: error
